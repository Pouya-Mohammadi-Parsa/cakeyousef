name: cakeyousef
description: کیک‌اکادمی - آکادمی آنلاین کیک و شیرینی
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  app_links: ^6.4.0
  video_player: ^2.10.0
  chewie: ^1.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/quick/
    - assets/images/calculator/
    - assets/data/cake_expert.json
    - google_fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
